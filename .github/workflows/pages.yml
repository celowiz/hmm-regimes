name: Dados + Pages
on:
  push:
    branches: [main]
  # PR: roda testes, dados e montagem do site para validar; só publica na main.
  pull_request:
  workflow_dispatch:
  schedule:
    # Minuto fora do :00/:30 (horários mais disputados no GitHub Actions, que atrasam 2–3 h).
    - cron: "13 22 * * 1-5"   # 19:13 BRT, após o fechamento da B3 e de NY
    # Reservas: só refazem o build se o site publicado ainda não tem o último pregão (job gate, olha data/summary.json → as_of).
    - cron: "13 0 * * 2-6"    # 21:13 BRT
    - cron: "23 11 * * 2-6"  # 08:23 BRT do dia seguinte: última chance antes da abertura
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Crons reserva: conferem o data/summary.json publicado e pulam o build se ele já tiver o último pregão (as_of).
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule' && github.event.schedule != '13 22 * * 1-5'
        with:
          sparse-checkout: scripts/backup_gate.py
          sparse-checkout-cone-mode: false
      - id: check
        if: github.event_name == 'schedule' && github.event.schedule != '13 22 * * 1-5'
        run: python3 scripts/backup_gate.py https://celowiz.github.io/hmm-regimes/data/summary.json
  build:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q tests
      - name: Baixar dados e ajustar HMM
        run: python scripts/build_hmm.py _site/data
      # Resumo pequeno (data/summary.json) lido pela página Mercado Hoje do portfólio
      - name: Resumo para o portfólio
        run: python scripts/summary.py _site/data
      - name: Montar site
        run: |
          cp -r index.html css js favicon.svg favicon-32.png apple-touch-icon.png og.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
