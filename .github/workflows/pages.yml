name: Dados + Pages
on:
  push:
    branches: [main]
  # PR: roda testes, dados e montagem do site para validar; só publica na main.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 BRT, após o fechamento da B3 e de NY
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q tests
      - name: Baixar dados e ajustar HMM
        run: python scripts/build_hmm.py _site/data
      - name: Montar site
        run: |
          cp -r index.html css js favicon.svg favicon-32.png apple-touch-icon.png og.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
